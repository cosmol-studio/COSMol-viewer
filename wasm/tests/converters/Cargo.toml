[package]
name = "cosmol_viewer_wasm_converter_tests"
version = "0.0.0"
edition.workspace = true
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(converter_invalid_input)", "cfg(converter_invalid_output)"] }

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
cosmol_viewer_derive.workspace = true
serde.workspace = true
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
