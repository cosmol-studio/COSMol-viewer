name: GitHub release

on:
  # The GitHub Release is created only after the complete publish workflow
  # succeeds for the same tag push.
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: create GitHub release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$WORKFLOW_RUN_EVENT" != "push" ]]; then
            echo "The publish workflow was not triggered by a push" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_RUN_CONCLUSION" != "success" ]]; then
            echo "The publish workflow did not succeed" >&2
            exit 1
          fi
          tag="$WORKFLOW_RUN_HEAD_BRANCH"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate version and extract changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          workspace = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          python_project = tomllib.loads(
              Path("crates/python/pyproject.toml").read_text(encoding="utf-8")
          )

          workspace_version = workspace["workspace"]["package"]["version"]
          python_version = python_project["project"]["version"]
          if workspace_version != version:
              raise SystemExit(
                  f"tag version {version} does not match Cargo version {workspace_version}"
              )
          if python_version != version:
              raise SystemExit(
                  f"tag version {version} does not match Python version {python_version}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header_match = re.search(
              r"^<!-- release-header:start -->\n"
              r"(?P<body>.*?)"
              r"^<!-- release-header:end -->$",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if header_match is None:
              raise SystemExit("CHANGELOG.md has no complete release-header block")

          release_header = header_match.group("body").strip()
          if not release_header:
              raise SystemExit("CHANGELOG.md has an empty release-header block")

          match = re.search(
              rf"^## \[{re.escape(version)}\] - "
              rf"(?P<date>\d{{4}}-\d{{2}}-\d{{2}})\n"
              rf"(?P<body>.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")

          version_notes = match.group("body").strip()
          if not version_notes:
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}")

          Path("release-notes.md").write_text(
              f"{release_header}\n\n"
              f"## COSMol Viewer v{version} - {match.group('date')}\n\n"
              f"{version_notes}\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: COSMol Viewer ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
