name: Release

on:
  workflow_dispatch:

concurrency:
  group: github-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Find an unreleased tag on this commit
        id: release_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo, per_page: 100,
            });
            const candidates = tags.filter(tag =>
              tag.name.startsWith('v') && tag.commit.sha === context.sha &&
              (!context.ref.startsWith('refs/tags/') ||
                context.ref === `refs/tags/${tag.name}`)
            );
            if (candidates.length === 0) {
              core.notice('This commit has no matching v* tag; no Release created.');
              return;
            }
            // Include drafts and prereleases: never update an existing Release.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const released = new Set(releases.map(release => release.tag_name));
            const pending = candidates.filter(tag => !released.has(tag.name));
            if (pending.length === 0) {
              core.notice('This commit has no unreleased tag; no Release created.');
              return;
            }
            if (pending.length !== 1) {
              core.setFailed('Multiple unreleased tags point to this commit. Run this workflow on the intended tag ref.');
              return;
            }
            core.setOutput('tag', pending[0].name);
            core.info(`Release tag: ${pending[0].name}`);

      - name: Checkout
        if: steps.release_tag.outputs.tag != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate versions and read release notes
        if: steps.release_tag.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          from tools.publish_policy import check_versions

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          workspace = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          python_project = tomllib.loads(Path("python/pyproject.toml").read_text(encoding="utf-8"))
          wasm = tomllib.loads(Path("wasm/Cargo.toml").read_text(encoding="utf-8"))
          rust_version = workspace["workspace"]["package"]["version"]
          wasm_version = wasm["package"]["version"]
          if wasm_version == {"workspace": True}:
              wasm_version = rust_version
          check_versions(
              rust_version, python_project["project"]["version"], wasm_version,
              "push", f"refs/tags/{tag}", False,
          )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          def block(name):
              match = re.search(
                  rf"^<!-- release-{name}:start -->\n(?P<body>.*?)^<!-- release-{name}:end -->$",
                  changelog, re.MULTILINE | re.DOTALL,
              )
              if match is None:
                  raise SystemExit(f"CHANGELOG.md has no complete release-{name} block")
              return match.group("body").strip()
          header, footer = block("header"), block("footer")
          if not header:
              raise SystemExit("CHANGELOG.md has an empty release-header block")
          match = re.search(
              rf"^## \[{re.escape(version)}\] - (?P<date>\d{{4}}-\d{{2}}-\d{{2}})\n"
              rf"(?P<body>.*?)(?=^## \[|^\[[^\]]+\]:|^<!-- release-footer:start -->|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}")
          Path("release-notes.md").write_text(
              f"{header}\n\n## COSMol Viewer v{version} - {match.group('date')}\n\n{notes}\n\n{footer}\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          case "$RELEASE_TAG" in
            *-dev.*|*-rc.*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
