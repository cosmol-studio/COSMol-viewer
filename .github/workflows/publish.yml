name: publish

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish RC versions to PyPI and npm (stable releases require a tag push)"
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    outputs:
      manual_publish_allowed: ${{ steps.release_policy.outputs.manual_publish_allowed }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/toolchain@v1.0.6
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
      - name: Install Python dev
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - uses: cargo-bins/cargo-binstall@main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check manual publishing policy
        id: release_policy
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          python tools/test_publish_policy.py -v
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              rust_version = tomllib.load(manifest)["workspace"]["package"]["version"]
          with open("crates/python/pyproject.toml", "rb") as manifest:
              python_version = tomllib.load(manifest)["project"]["version"]
          candidate = re.fullmatch(r"(\d+\.\d+\.\d+)-rc\.(\d+)", rust_version)
          allowed = candidate is not None and python_version == f"{candidate[1]}rc{candidate[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manual_publish_allowed={str(allowed).lower()}\n")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and os.environ["PUBLISH_REQUESTED"] == "true" and not allowed:
              raise SystemExit("::error::Manual publishing requires matching RC versions in Rust and Python. Stable releases must be published by pushing a tag.")
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install browser smoke test dependencies
        run: |
          npm install --prefix target/browser-check --no-save playwright@1.58.2
          target/browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and check Alef browser bindings
        run: |
          cargo binstall -y wasm-pack --force
          cargo binstall -y alef --version 0.103.12 --force
          python -m unittest discover -s crates/wasm/tools/wasm_binding -p 'test_*.py' -v
          python crates/wasm/tools/wasm_binding/build.py --check --browser-check
      - name: Check Rust binding contracts
        run: |
          cargo test -p cosmol_viewer_derive
          cargo test -p cosmol_viewer_core --test binding_contract
          cargo test -p cosmol_viewer_core --doc binding_contract
          cargo test -p cosmol_viewer_wasm --no-default-features --test binding_contract
          cargo test -p cosmol_viewer_wasm --no-default-features --test scene
      - name: build pyi
        working-directory: crates/python
        run: |
          cargo run --bin stub_gen --no-default-features --features stubgen
      - name: Check Python API and Notebook command transport
        run: |
          python -m pip install maturin
          maturin build --manifest-path crates/python/Cargo.toml --out target/contract-wheels
          python -m pip install target/contract-wheels/*.whl
          python crates/python/tests/test_binding_surface.py
          python crates/python/tests/test_viewer_backend.py
      - name: Upload wasm pkg
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: ./crates/wasm/pkg
      - name: Upload cosmol_viewer.pyi
        uses: actions/upload-artifact@v4
        with:
          name: pyi
          path: ./crates/python/cosmol_viewer.pyi

  linux:
    needs: wasm
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86
            rust_target: i686-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: aarch64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg
      - name: Download pyi
        uses: actions/download-artifact@v4
        with:
          name: pyi
          path: ./crates/python/
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --features x11,wayland
          working-directory: crates/python
          sccache: true
          manylinux: auto
          # Install inside the build container before the hook invokes Cargo.
          before-script-linux: |
            uv tool install "sccache>=0.11.0"
            sccache --version
            RUSTC_WRAPPER=sccache python3 build_native_viewer.py --release --target ${{ matrix.platform.rust_target }} --features x11,wayland
            sccache --show-stats
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: crates/python/dist

  windows:
    needs: wasm
    runs-on: ${{ matrix.platform.runner }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
    strategy:
      matrix:
        platform:
          - runner: windows-2025
            target: x64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-2025
            target: x86
            rust_target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Build native renderer
        run: python crates/python/build_native_viewer.py --release --target ${{ matrix.platform.rust_target }}
      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg
      - name: Download pyi
        uses: actions/download-artifact@v4
        with:
          name: pyi
          path: ./crates/python/
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: crates/python
          # Use the job's wrapper; avoid installing another sccache instance.
          sccache: false
      - name: Show sccache stats
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: crates/python/dist

  macos:
    needs: wasm
    runs-on: ${{ matrix.platform.runner }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
    strategy:
      matrix:
        platform:
          - runner: macos-26
            target: x86_64
            rust_target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Build native renderer
        run: python crates/python/build_native_viewer.py --release --target ${{ matrix.platform.rust_target }}
      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg
      - name: Download pyi
        uses: actions/download-artifact@v4
        with:
          name: pyi
          path: ./crates/python/
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: crates/python
          # Use the job's wrapper; avoid installing another sccache instance.
          sccache: false
      - name: Show sccache stats
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: crates/python/dist

  sdist:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg
      - name: Download pyi
        uses: actions/download-artifact@v4
        with:
          name: pyi
          path: crates/python/
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/python
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/python/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [wasm, linux, windows, macos, sdist]
    # needs: [linux, windows, macos, windows-arm, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "wheels-*/*"
      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.wasm.outputs.manual_publish_allowed == 'true') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
      - name: Publish to npm
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.wasm.outputs.manual_publish_allowed == 'true') }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg
      - name: Run npm publish
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.wasm.outputs.manual_publish_allowed == 'true') }}
        working-directory: crates/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_tag="$(node -p "require('./package.json').version.includes('-') ? 'rc' : 'latest'")"
          npm publish --access public --tag "$npm_tag"
