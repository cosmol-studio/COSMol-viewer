name: publish

on:
  push:
      tags:
          - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish dev/RC versions to PyPI, npm and Anaconda.org (stable releases require a tag push)"
        type: boolean
        default: false

permissions:
    contents: write

jobs:
    generate-stubs:
        name: generate pyi stubs
        runs-on: ubuntu-latest
        needs: [build-wasm]
        outputs:
            manual_publish_allowed: ${{ steps.release_policy.outputs.manual_publish_allowed }}
            conda_label: ${{ steps.release_policy.outputs.conda_label }}

        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install stub dependencies
              run: |
                  cargo install pyo3-introspection --version 0.30.1 --locked

            - name: Check release policy
              id: release_policy
              env:
                  PUBLISH_REQUESTED: ${{ inputs.publish }}
              run: |
                  python -m unittest discover -s tools -p 'test*publish_policy.py' -v
                  python tools/publish_policy.py

            - name: Download browser package
              uses: actions/download-artifact@v4
              with:
                  name: wasm-pkg
                  path: wasm/pkg

            - name: Generate pyi stubs (release pipeline only)
              run: |
                  python python/build.py

            - name: Upload pyi artifact
              uses: actions/upload-artifact@v4
              with:
                  name: python-stubs
                  path: python/cosmol_viewer.pyi
                  if-no-files-found: error

    build-wasm:
        name: build and test npm package
        runs-on: ubuntu-latest
        env:
            CARGO_TARGET_DIR: ${{ github.workspace }}/target/wasm
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: wasm-package-v2
                  workspaces: "wasm -> ../target/wasm"
                  cache-workspace-crates: true
                  cache-on-failure: true
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Build and validate npm package
              run: |
                  set -euo pipefail
                  wasm-pack build wasm --target web --release --out-dir pkg --out-name cosmol_viewer_wasm --locked
                  cp wasm/js/* wasm/README.md LICENSE wasm/pkg/
                  npm pkg set --prefix wasm/pkg \
                      name=@cosmol-studio/cosmol-viewer type=module main=index.js types=index.d.ts \
                      'sideEffects[]=./index.js' dependencies.@cosmol-studio/cosmolkit=0.6.2 \
                      publishConfig.access=public \
                      "publishConfig.tag=$(node -p "require('./wasm/pkg/package.json').version.split('-')[1]?.split('.')[0] || 'latest'")"
                  npm pkg set --prefix wasm/pkg 'files[]=index.js'
                  npm pkg set --prefix wasm/pkg 'files[]=index.d.ts'
                  npm install --prefix wasm/pkg --ignore-scripts --no-audit --no-fund --package-lock=false
                  python wasm/check.py
                  npm pack --dry-run --json ./wasm/pkg

            - name: Upload npm package
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-pkg
                  path: |
                      wasm/pkg
                      !wasm/pkg/node_modules
                  if-no-files-found: error

    build-wheels:
        name: build wheel ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        needs:
            - generate-stubs
            - build-wasm
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86_64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: linux-aarch64
                      os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      manylinux: "2014"
                    - name: macos-x86_64
                      os: macos-latest
                      target: x86_64-apple-darwin
                      manylinux: auto
                    - name: macos-aarch64
                      os: macos-latest
                      target: aarch64-apple-darwin
                      manylinux: auto
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      manylinux: auto

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Download browser package
              uses: actions/download-artifact@v4
              with:
                  name: wasm-pkg
                  path: wasm/pkg

            - name: Setup CPython 3.11
              if: runner.os != 'Linux'
              id: py311
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
                  update-environment: false
                  architecture: ${{ matrix.name == 'macos-aarch64' && 'arm64' || 'x64' }}

            - name: Setup CPython 3.12
              if: runner.os != 'Linux'
              id: py312
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  update-environment: false
                  architecture: ${{ matrix.name == 'macos-aarch64' && 'arm64' || 'x64' }}

            - name: Setup CPython 3.13
              if: runner.os != 'Linux'
              id: py313
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  update-environment: false
                  architecture: ${{ matrix.name == 'macos-aarch64' && 'arm64' || 'x64' }}

            - uses: dtolnay/rust-toolchain@stable
              if: runner.os != 'Linux'
              with:
                  targets: ${{ matrix.target }}

            - name: Patch surfman for Windows release artifacts
              if: runner.os == 'Windows'
              shell: bash
              run: '"${{ steps.py312.outputs.python-path }}" tools/prepare_release_surfman.py'

            - name: Build native renderer
              if: runner.os != 'Linux'
              shell: bash
              run: '"${{ steps.py312.outputs.python-path }}" python/build_native_viewer.py --release --target ${{ matrix.target }}'

            - name: Build abi3 wheel
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  sccache: true
                  before-script-linux: |
                      # The action installs sccache after this hook; install it before Cargo.
                      uv tool install "sccache>=0.10.0"
                      python3 build_native_viewer.py --release --target ${{ matrix.target }}
                  args:  >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-abi3-py39
                      --out dist

            - name: Build selected CPython wheels
              if: runner.os == 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter python3.11 python3.12 python3.13
                      --out dist

            # macOS / Windows: use absolute paths provided by setup-python.
            - name: Build CPython 3.11 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py311.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.12 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py312.outputs.python-path }}"
                      --out dist

            - name: Build CPython 3.13 wheel
              if: runner.os != 'Linux'
              uses: PyO3/maturin-action@v1
              with:
                  command: build
                  working-directory: python
                  target: ${{ matrix.target }}
                  sccache: true
                  args: >-
                      --release
                      --manifest-path Cargo.toml
                      --no-default-features
                      --features release-cpython
                      --interpreter "${{ steps.py313.outputs.python-path }}"
                      --out dist

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.name }}
                  path: python/dist

    build-sdist:
        name: build sdist
        runs-on: ubuntu-latest
        needs:
            - generate-stubs
            - build-wasm

        steps:
            - uses: actions/checkout@v4

            - name: Download pyi stubs
              uses: actions/download-artifact@v4
              with:
                  name: python-stubs
                  path: python

            - name: Download browser package
              uses: actions/download-artifact@v4
              with:
                  name: wasm-pkg
                  path: wasm/pkg

            - name: Copy README into python package
              run: cp README.md python/README.md

            - name: Rewrite sdist README path
              run: sed -i 's#readme = "../README.md"#readme = "./README.md"#' python/pyproject.toml

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  working-directory: python
                  args: --manifest-path Cargo.toml --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: python/dist

    publish:
        name: publish to PyPI, npm and Anaconda.org
        permissions:
            contents: read
            id-token: write
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.generate-stubs.outputs.manual_publish_allowed == 'true') }}
        runs-on: ubuntu-latest
        needs:
            - generate-stubs
            - build-wheels
            - build-sdist
            - build-wasm

        steps:
            - uses: actions/checkout@v4
            - name: Download wheel artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Download sdist artifact
              uses: actions/download-artifact@v4
              with:
                  name: sdist
                  path: dist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Download npm package
              uses: actions/download-artifact@v4
              with:
                  name: wasm-pkg
                  path: wasm/pkg

            - name: Publish npm package
              working-directory: wasm/pkg
              run: |
                  set -euo pipefail
                  npm_tag="$(node -p "require('./package.json').publishConfig.tag")"
                  npm publish --access public --tag "$npm_tag"

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - run: python -m pip install anaconda-client==1.15.0 conda-package-handling==2.6.0 installer==1.0.1 packaging
            - name: Package wheels for conda
              run: python tools/package_wheels.py dist conda-dist
            - name: Publish to Anaconda.org
              env:
                  ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
                  CONDA_LABEL: ${{ needs.generate-stubs.outputs.conda_label }}
              run: |
                  test -n "$ANACONDA_API_TOKEN" || { echo 'Set the ANACONDA_API_TOKEN repository secret.' >&2; exit 1; }
                  anaconda upload --user cosmol-studio --label "$CONDA_LABEL" conda-dist/*/*.conda
