name: publish

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish dev/RC versions to PyPI and npm (stable releases require a tag push)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    name: build and test npm package
    runs-on: ubuntu-latest
    outputs:
      manual_publish_allowed: ${{ steps.release_policy.outputs.manual_publish_allowed }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check release policy
        id: release_policy
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/publish_policy.py
      - uses: cargo-bins/cargo-binstall@main
      - name: Install browser build and smoke test tools
        run: |
          cargo binstall -y wasm-pack --force
          npm install --prefix target/browser-check --no-save playwright@1.58.2
          target/browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and validate browser bindings
        run: |
          python wasm/build.py --check --browser-check
          python wasm/build.py --release
          npm pack --dry-run --json ./wasm/pkg
      - name: Check Rust binding contracts
        run: |
          cargo test -p cosmol_viewer_derive --locked
          cargo test -p cosmol_viewer_core --locked --test binding_contract --test display --test residue_code
          cargo test -p cosmol_viewer_core --locked --doc
          cargo test -p cosmol_viewer_wasm --locked --no-default-features --test binding_contract --test scene
      - name: Upload browser package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
          if-no-files-found: error

  generate-stubs:
    name: generate and test Python projections
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Download browser package for Notebook embedding
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Build and check official Python declarations
        run: |
          python -m pip install "maturin==1.15.0" "basedpyright==1.40.2" "cosmolkit>=0.6,<0.7"
          python python/build.py --install-extractor --check
      - name: Check packaged Python API and Notebook transport
        run: |
          python python/build_native_viewer.py
          maturin build --locked --generate-stubs --manifest-path python/Cargo.toml --out target/contract-wheels
          python -m pip install target/contract-wheels/*.whl
          python python/tests/test_binding_surface.py
          python python/tests/test_viewer_backend.py
      - name: Upload Python declarations
        uses: actions/upload-artifact@v4
        with:
          name: python-stubs
          path: python/cosmol_viewer.pyi
          if-no-files-found: error

  build-wheels:
    name: build wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [build-wasm, generate-stubs]
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python_arch: x64
          - name: linux-x86
            os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            python_arch: x64
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            python_arch: x64
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - name: windows-x86
            os: windows-2025
            target: i686-pc-windows-msvc
            python_arch: x86
          - name: macos-x86_64
            os: macos-26
            target: x86_64-apple-darwin
            python_arch: x64
          - name: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo downloads and build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: true
          cache-bin: false
          cache-on-failure: true
      # Keep the existing manylinux cache mounts and renderer build hook.
      - name: Cache Cargo downloads for manylinux
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-${{ matrix.target }}-
      - name: Prepare Cargo cache directories
        if: runner.os == 'Linux'
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Download browser package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Download Python declarations
        uses: actions/download-artifact@v4
        with:
          name: python-stubs
          path: python
      - name: Build native renderer
        if: runner.os != 'Linux'
        run: python python/build_native_viewer.py --release --target ${{ matrix.target }}
      - name: Build manylinux wheel and renderer
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --generate-stubs --out dist --find-interpreter
          working-directory: python
          sccache: true
          manylinux: auto
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
          before-script-linux: |
            # Install the wrapper before any Cargo command can invoke it.
            uv tool install "sccache>=0.11.0"
            sccache --version
            RUSTC_WRAPPER=sccache python3 build_native_viewer.py --release --target ${{ matrix.target }}
            sccache --show-stats
      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --generate-stubs --out dist --find-interpreter
          working-directory: python
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: python/dist
          if-no-files-found: error

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    needs: [build-wasm, generate-stubs]
    steps:
      - uses: actions/checkout@v6
      - name: Download browser package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Download Python declarations
        uses: actions/download-artifact@v4
        with:
          name: python-stubs
          path: python
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist
          if-no-files-found: error

  publish:
    name: publish to PyPI and npm
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish && needs.build-wasm.outputs.manual_publish_allowed == 'true') }}
    runs-on: ubuntu-latest
    needs: [build-wasm, generate-stubs, build-wheels, build-sdist]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Publish to npm
        working-directory: wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_tag="$(node -p "require('./package.json').version.includes('-') ? require('./package.json').version.split('-')[1].split('.')[0] : 'latest'")"
          npm publish --access public --tag "$npm_tag"
