name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built packages to PyPI and npm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    name: build npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: cargo-bins/cargo-binstall@main
      - name: Install browser build tool
        run: cargo binstall -y wasm-pack --force
      - name: Build browser bindings
        run: python wasm/build.py --release
      - name: Upload browser package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
          if-no-files-found: error

  generate-stubs:
    name: generate Python declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare compile-only Notebook assets
        run: |
          # Rust include_str!/include_bytes! need files, but type extraction
          # does not execute Notebook code. Only the .pyi leaves this job.
          mkdir -p wasm/pkg
          touch wasm/pkg/cosmol_viewer_wasm.js wasm/pkg/cosmol_viewer_wasm_bg.wasm
      - name: Generate official Python declarations
        run: python python/build.py --install-extractor
      - name: Upload Python declarations
        uses: actions/upload-artifact@v4
        with:
          name: python-stubs
          path: python/cosmol_viewer.pyi
          if-no-files-found: error

  build-wheels:
    name: build wheel ${{ matrix.platform.name }} ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    needs: [build-wasm, generate-stubs]
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        python: ["abi3", "3.11", "3.12", "3.13"]
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            os: macos-26
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: wheel_python
        with:
          python-version: ${{ matrix.python == 'abi3' && '3.12' || matrix.python }}
          architecture: ${{ matrix.platform.name == 'macos-aarch64' && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.platform.target }}
      - name: Cache Cargo downloads and build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}-${{ matrix.python }}
          cache-targets: true
          cache-bin: false
          cache-on-failure: true
      # Keep the existing manylinux cache mounts and renderer build hook.
      - name: Cache Cargo downloads for manylinux
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-${{ matrix.platform.target }}-
      - name: Prepare Cargo cache directories
        if: runner.os == 'Linux'
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Download browser package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Download Python declarations
        uses: actions/download-artifact@v4
        with:
          name: python-stubs
          path: python
      - name: Build native renderer
        if: runner.os != 'Linux'
        run: python python/build_native_viewer.py --release --target ${{ matrix.platform.target }}
      - name: Build manylinux wheel and renderer
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: >-
            --release --locked --generate-stubs --out dist
            --no-default-features
            --features ${{ matrix.python == 'abi3' && 'release-abi3-py39' || 'release-cpython' }}
            --interpreter python${{ matrix.python == 'abi3' && '3.12' || matrix.python }}
          working-directory: python
          sccache: true
          manylinux: "2014"
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
          before-script-linux: |
            # Install the wrapper before any Cargo command can invoke it.
            uv tool install "sccache>=0.11.0"
            sccache --version
            RUSTC_WRAPPER=sccache python3 build_native_viewer.py --release --target ${{ matrix.platform.target }}
            sccache --show-stats
      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: >-
            --release --locked --generate-stubs --out dist
            --no-default-features
            --features ${{ matrix.python == 'abi3' && 'release-abi3-py39' || 'release-cpython' }}
            --interpreter "${{ steps.wheel_python.outputs.python-path }}"
          working-directory: python
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}-${{ matrix.python }}
          path: python/dist
          if-no-files-found: error

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    needs: [build-wasm, generate-stubs]
    steps:
      - uses: actions/checkout@v6
      - name: Download browser package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Download Python declarations
        uses: actions/download-artifact@v4
        with:
          name: python-stubs
          path: python
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist
          if-no-files-found: error

  publish:
    name: publish to PyPI and npm
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    needs: [build-wasm, generate-stubs, build-wheels, build-sdist]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - name: Publish to npm
        working-directory: wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_tag="$(node -p "require('./package.json').version.includes('-') ? require('./package.json').version.split('-')[1].split('.')[0] : 'latest'")"
          npm publish --access public --tag "$npm_tag"
