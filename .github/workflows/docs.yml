name: Dioxus documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: viewer-docs-dioxus-0.7.10
          workspaces: docs-web -> target
          cache-targets: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.local/share/.dx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install released wheel and documentation tools
        run: |
          uv venv --python 3.11 docs-web/.venv
          uv pip install --python docs-web/.venv/bin/python --only-binary=:all: -r docs-web/requirements.txt
          docs-web/.venv/bin/python -m playwright install --with-deps chromium
      - name: Test deployment scripts
        run: docs-web/.venv/bin/python -m unittest discover -s docs-web/scripts -p 'test_*.py' -v
      - name: Build Sphinx source
        run: docs-web/.venv/bin/python -m sphinx -W --keep-going -E -b html crates/python/docs/source crates/python/docs/_build/html
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus and search tooling
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --no-confirm --disable-strategies compile
          docs-web/.venv/bin/python docs-web/scripts/build_search_bundle.py --install-tools
      - name: Test Rust search engine
        run: cargo test --manifest-path docs-web/Cargo.toml --lib --no-default-features --features search-engine --release --target-dir docs-web/target/search-engine --locked
      - name: Build static Dioxus site
        working-directory: docs-web
        run: |
          public_dir="target/dx/cosmol-viewer-docs-web/release/web/public"
          if [ -d "$public_dir" ]; then
            mv "$public_dir" "$RUNNER_TEMP/viewer-docs-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          dx build --release --web --fullstack true --ssg --features ssg --force-sequential
      - name: Prepare and validate deployment
        run: |
          public_dir="docs-web/target/dx/cosmol-viewer-docs-web/release/web/public"
          docs-web/.venv/bin/python docs-web/scripts/prepare_deployment.py "$public_dir" crates/python/docs/_build/html
          docs-web/.venv/bin/python docs-web/scripts/check_ssg_output.py "$public_dir"
          docs-web/.venv/bin/python docs-web/scripts/check_search_browser.py "$public_dir"
          docs-web/.venv/bin/python docs-web/scripts/check_layout_browser.py "$public_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-docs-public
          path: docs-web/target/dx/cosmol-viewer-docs-web/release/web/public
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-docs-screenshots
          path: docs-web/target/screenshots
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viewer-docs-public
          path: deploy/web/public
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy/web/public/ --project-name=cosmol-viewer-docs --branch=main
