[package]
name = "cosmol_viewer_core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
serde_json.workspace = true
egui_extras.workspace = true
serde.workspace = true
base64.workspace = true
thiserror.workspace = true
image.workspace = true

glam = { version = "0.34.0" , features = ["serde", "bytemuck"] }
bytemuck = "1.25.0"
dashmap = "6.1.0"
regex = "1.12.3"
rayon = "1.11.0"
once_cell = "1.21.4"
wide = "1.2.0"
kiddo = "6.0.2"
compile-time = "0.4.0"
postcard = { version = "1.1.3", features = ["alloc"] }

cosmolkit.workspace = true
cosmol_viewer_derive.workspace = true

[build-dependencies]
resvg = "0.48.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iceoryx2 = "=0.10.0"
surfman = { version = "0.14.0", features = ["sm-x11"] }

[features]
default = []
wayland = []
x11 = []

[[bench]]
name = "molecule_instances"
harness = false

[[bin]]
name = "cosmol-viewer-native"
path = "src/bin/native_viewer.rs"
