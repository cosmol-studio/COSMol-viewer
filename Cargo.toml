[workspace.package]
edition = "2024"
version = "0.6.2-rc.1"
authors = ["9028 wjt@cosmol.org"]
repository = "https://github.com/cosmol-studio/COSMol-viewer"
homepage = "https://github.com/cosmol-studio/COSMol-viewer"
keywords = ["molecular", "visualization"]
license = "MIT"
description = "Molecular visualization tools by rust"

[workspace]
resolver = "2"
members = [
    "cosmol_viewer",
    "crates/core",
    "crates/derive",
    "python",
    "wasm",
    "wasm/tests/converters",
    ]

[workspace.dependencies]
cosmol_viewer = { version = "0.6.2-rc.1", path = "cosmol_viewer"}
cosmol_viewer_core = { version = "0.6.2-rc.1", path = "crates/core" }
cosmol_viewer_derive = { version = "0.6.2-rc.1", path = "crates/derive" }
pyo3 = { version = "=0.30.1", default-features = false, features = ["multiple-pymethods"] }
eframe = { version = "0.35.0", features = ["wayland","x11","glow","default_fonts"], default-features = false }
egui_extras = { version = "0.35.0", default-features = false }
serde = { version = "1.0.228" , features = ["derive"] }
cosmolkit = { version = "=0.6.2-rc.1", default-features = false }
serde_json = "1.0.149"
thiserror = "2.0.18"
base64 = "0.23.1"
image = "0.25.9"
flate2 = "1.1.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
incremental = false
